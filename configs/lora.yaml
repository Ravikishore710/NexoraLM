lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-5
  weight_decay: 0.01
  max_seq_len: 2048
  epochs: 3
  warmup_ratio: 0.03
  lr_schedule: "cosine"
  mixed_precision: "fp16"
  loss_masking: "assistant_only"
  seed: 42
