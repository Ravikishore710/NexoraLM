<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoraLM — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-avatar">N</div>
          <div class="brand-text">
            <span class="brand-title">NexoraLM</span>
            <span class="brand-subtitle">126M Foundation Model</span>
          </div>
        </div>
        <button type="button" class="btn-new-chat" id="btnNewChat" title="New Conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Chat</span>
        </button>
      </div>

      <div class="sidebar-section-title">Recent Conversations</div>
      <div class="chat-history-list" id="chatHistoryList">
        <!-- Dynamically rendered conversations -->
      </div>

      <div class="sidebar-footer">
        <div class="backend-status" id="backendStatus">
          <span class="status-dot online"></span>
          <span class="status-text">NexoraLM Ready</span>
        </div>
        <a href="https://github.com/Ravikishore710/NexoraLM" target="_blank" class="github-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span>Ravikishore710/NexoraLM</span>
        </a>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-main">
      <!-- Top header -->
      <header class="chat-topbar">
        <div class="topbar-left">
          <button type="button" class="btn-icon" id="btnToggleSidebar" title="Toggle Sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
          <div class="chat-session-title" id="currentChatTitle">New Chat</div>
        </div>
        <div class="topbar-right">
          <button type="button" class="btn-clear-chat" id="btnClearChat" title="Clear messages">Clear Chat</button>
        </div>
      </header>

      <!-- Messages area -->
      <div class="messages-container" id="messagesContainer">
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-avatar">N</div>
          <h1 class="welcome-title">How can NexoraLM help you today?</h1>
          <p class="welcome-subtitle">Ask questions, explore topics, generate ideas, or learn about machine learning architectures.</p>
          
          <div class="suggestion-grid">
            <button type="button" class="suggestion-card" data-prompt="What is deep learning and how does a neural network learn?">
              <span class="suggestion-title">Explain Deep Learning</span>
              <span class="suggestion-desc">Understand weights, layers, and backpropagation</span>
            </button>
            <button type="button" class="suggestion-card" data-prompt="Why use Grouped-Query Attention (GQA) instead of standard Multi-Head Attention?">
              <span class="suggestion-title">Grouped-Query Attention</span>
              <span class="suggestion-desc">How 3:1 head sharing cuts KV-cache bandwidth</span>
            </button>
            <button type="button" class="suggestion-card" data-prompt="How do Rotary Position Embeddings (RoPE) encode token distance?">
              <span class="suggestion-title">RoPE Mechanism</span>
              <span class="suggestion-desc">Relative distance preservation via 2D rotations</span>
            </button>
            <button type="button" class="suggestion-card" data-prompt="What is the difference between LoRA and QLoRA fine-tuning?">
              <span class="suggestion-title">LoRA vs QLoRA</span>
              <span class="suggestion-desc">Adapter ranks and 4-bit quantized base weights</span>
            </button>
          </div>
        </div>

        <div class="messages-list" id="messagesList"></div>
      </div>

      <!-- Bottom Chat Input Bar -->
      <div class="chat-input-area">
        <form class="chat-input-form" id="chatForm">
          <textarea 
            class="chat-textarea" 
            id="chatInput" 
            placeholder="Send a message to NexoraLM..." 
            rows="1"
            autofocus></textarea>
          <button type="submit" class="btn-send-message" id="btnSend" title="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="input-footer-note">
          NexoraLM 126M &bull; Pretrained on 300M tokens &bull; SFT & DPO aligned
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
